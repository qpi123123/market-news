name: 아침 뉴스 수집

on:
  schedule:                  # 시각은 UTC (KST −9시간). GitHub 사정으로 5~30분 늦을 수 있음
    - cron: "30 21 * * *"    # 매일 06:30 KST — 아침 정리
    - cron: "0 23 * * 0-4"   # 평일 08:00 KST — 장 시작 전
    - cron: "0 3 * * 1-5"    # 평일 12:00 KST — 점심
    - cron: "40 6 * * 1-5"   # 평일 15:40 KST — 장 마감 직후
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # 결과 페이지·기록을 저장소에 커밋하기 위해 필요
  models: read               # AI 주식 판별 (GitHub Models 무료 사용량)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 및 페이지 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
        run: python collector/main.py

      - name: 결과 커밋 (GitHub Pages가 docs/ 를 서비스)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "뉴스 수집 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push
