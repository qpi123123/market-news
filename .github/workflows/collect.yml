name: 아침 뉴스 수집

on:
  schedule:                  # 시각은 UTC (KST -9시간). GitHub 사정으로 5~30분 늦을 수 있음
    - cron: "30 21 * * *"    # 매일 06:30 KST — 아침 정리
    - cron: "0 23 * * 0-4"   # 평일 08:00 KST — 장 시작 전
    - cron: "0 3 * * 1-5"    # 평일 12:00 KST — 점심
    - cron: "40 6 * * 1-5"   # 평일 15:40 KST — 장 마감 직후
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # 기록(data/)을 저장소에 커밋
  pages: write               # 페이지 게시
  id-token: write            # 페이지 게시

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 및 페이지 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Seoul
        run: python collector/main.py

      # 기록(작은 JSON)만 커밋. 페이지(docs/)는 커밋하지 않고 바로 게시 → 저장소 용량이 거의 늘지 않음
      - name: 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
